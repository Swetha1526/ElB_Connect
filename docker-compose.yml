version: '3.8'

services:
  # VoltFlow Full-Stack Application
  voltflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltflow_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=VoltFlow — Electricity Board Management API
      - DEBUG=False
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./voltflow.db
      # For PostgreSQL:
      # - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/voltflow_db
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional PostgreSQL Production Service (uncomment to enable)
  # db:
  #   image: postgres:15-alpine
  #   container_name: voltflow_postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgrespassword
  #     POSTGRES_DB: voltflow_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  app_data:
  # postgres_data:
