<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#0f172a" stroke="url(#voltGrad)" stroke-width="2.5" />
  <!-- Hexagon grid lines -->
  <path d="M24 8 L38 16 V32 L24 40 L10 32 V16 Z" stroke="#1e293b" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Lightning Bolt -->
  <path d="M26 9 L15 25 H24 L21 39 L33 23 H24 L26 9 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
